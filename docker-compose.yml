version: '3.8'

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: theowl_app
    container_name: theowl_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    user: "www-data"
    depends_on:
      - db

  webserver:
    image: nginx:stable-alpine
    container_name: theowl_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  node:
    image: node:18-alpine
    container_name: theowl_node
    restart: "no"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  db:
    image: mysql:8.0
    container_name: theowl_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  mailhog:
    image: mailhog/mailhog
    container_name: theowl_mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    expose:
      - "1025"

volumes:
  dbdata:
